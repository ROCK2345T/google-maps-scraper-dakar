[project]
name = "google-maps-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "playwright>=1.63.0",
    "streamlit>=1.64.0",
]

[project.scripts]
google-maps-scraper = "google_maps_scraper:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
